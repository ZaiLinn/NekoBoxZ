name: Source checks
on:
  pull_request:
  push:
    branches: ['fix/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Install native toolchain
        run: sdkmanager "ndk;25.0.8775105" "platforms;android-35"
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Go regressions and shell syntax
        run: |
          bash buildScript/lib/core/get_source.sh
          git ls-files '*.sh' -z | xargs -0 -n1 bash -n
          cd libcore
          go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api ./...
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      # hev-socks5-tunnel executable for the root transparent proxy mode
      - name: Hev Tunnel Cache
        id: hev-cache
        uses: actions/cache@v4
        with:
          path: app/executableSo
          key: hevtun-${{ hashFiles('buildScript/lib/hevtun.sh') }}
      - name: Install Android toolchain
        run: sdkmanager "ndk;25.0.8775105" "platforms;android-35" "build-tools;35.0.1"
      - name: Build Hev Tunnel
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: ./run lib hevtun
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          # for the release lookups in buildScript/lib/assets.sh
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:testOssDebugUnitTest app:assembleOssDebug
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: signed-test-APKs
          path: ${{ env.APK }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests
