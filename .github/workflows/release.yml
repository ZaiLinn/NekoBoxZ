name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish: If want ignore"
        required: false
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore -type f -name "*.sh" -print0 | sort -z | xargs -0 cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore -type f -name "*.sh" -print0 | sort -z | xargs -0 cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
          # the libcore job saved it under this key: a miss means the keys differ, not a build
          fail-on-cache-miss: true
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      # hev-socks5-tunnel executable for the root transparent proxy mode
      - name: Hev Tunnel Cache
        id: hev-cache
        uses: actions/cache@v4
        with:
          path: app/executableSo
          key: hevtun-${{ hashFiles('buildScript/lib/hevtun.sh') }}
      - name: Build Hev Tunnel
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: ./run lib hevtun
      # Signing: releases must use the permanent key from the KEYSTORE_BASE64 / KEYSTORE_PASS /
      # ALIAS_NAME / ALIAS_PASS secrets. No fallback key: a release signed with another key
      # can't be installed over the previous one.
      - name: Prepare Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          SECRET_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SECRET_KEYSTORE_PASS" ] || [ -z "$SECRET_ALIAS_NAME" ] || [ -z "$SECRET_ALIAS_PASS" ]; then
            echo "::error::Signing secrets are missing, refusing to build a release with another key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PASS=$SECRET_KEYSTORE_PASS" >> $GITHUB_ENV
          echo "ALIAS_NAME=$SECRET_ALIAS_NAME" >> $GITHUB_ENV
          echo "ALIAS_PASS=$SECRET_ALIAS_PASS" >> $GITHUB_ENV
          echo "Using keystore from secrets"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          # for the release lookups in buildScript/lib/assets.sh
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Verify Signature
        env:
          # SHA-256 of the release signing certificate (public, not a secret)
          EXPECTED_CERT_SHA256: 52ac5a16920e0f0c8a9f6f2a477b0dcc6499db93a46efc6c0dc15fe55d341ba1
        run: |
          # the build tools the build itself uses (buildSrc/Helpers.kt); the newest on the runner
          # may need a newer Java
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          for apk in "$APK"/*.apk; do
            out=$("$APKSIGNER" verify --print-certs "$apk" 2>&1) || { echo "$out"; echo "::error::apksigner failed on $apk"; exit 1; }
            actual=$(echo "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
              echo "$out"
              echo "::error::$apk is signed with '$actual', expected $EXPECTED_CERT_SHA256"
              exit 1
            fi
            echo "$(basename "$apk"): signature OK"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Donwload Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Release
        run: |
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz
          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          ./ghr -delete -c "${{ github.sha }}" -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" apks
